<!DOCTYPE html>

<title>転生クエスト - Screens</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DotGothic16', monospace;
    background: #111;
    color: #fff;
    min-height: 100vh;
    padding: 24px 16px;
    line-height: 1.6;
    letter-spacing: 1px;
  }
  .container { max-width: 600px; margin: 0 auto; }
  .breadcrumb { font-size: 11px; color: #666; margin-bottom: 16px; }
  .breadcrumb a { color: #888; text-decoration: none; }

  h1 { font-size: 20px; margin-bottom: 4px; }
  .desc { font-size: 12px; color: #aaa; margin-bottom: 24px; }
  .screen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .screen-card {
    display: block;
    background: #000;
    padding: 3px;
    border-radius: 4px;
    text-decoration: none;
    color: #fff;
  }
  .screen-card-border {
    background: #fff;
    padding: 2px;
    border-radius: 3px;
  }
  .screen-card-inner {
    background: #000;
    padding: 14px 12px;
    border-radius: 2px;
    text-align: center;
  }
  .screen-card:active .screen-card-inner { background: #222; }
  .screen-icon { font-size: 24px; display: block; margin-bottom: 6px; }
  .screen-name { font-size: 13px; }
  .screen-name-en { font-size: 10px; color: #666; margin-top: 2px; }
</style>
</head>
